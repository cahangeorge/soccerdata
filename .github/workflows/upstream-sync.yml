name: Safely sync upstream

on:
  schedule:
    - cron: '39 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  BOOTSTRAP_BRANCH: master
  PLATFORM_BRANCH: platform
  UPSTREAM_BRANCH: master
  UPSTREAM_REPOSITORY: probberechts/soccerdata

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream and initialise managed branches
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          if git ls-remote --exit-code --heads origin "${PLATFORM_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${PLATFORM_BRANCH}:refs/remotes/origin/${PLATFORM_BRANCH}"
            git checkout -B "${PLATFORM_BRANCH}" "origin/${PLATFORM_BRANCH}"
          else
            git fetch origin "refs/heads/${BOOTSTRAP_BRANCH}:refs/remotes/origin/${BOOTSTRAP_BRANCH}"
            git checkout -B "${PLATFORM_BRANCH}" "origin/${BOOTSTRAP_BRANCH}"
            git push origin "${PLATFORM_BRANCH}"
          fi
          # This branch is an audit mirror only. Never force-push a source branch.
          git push origin "upstream/${UPSTREAM_BRANCH}:refs/heads/upstream-master"
          if git log --format=%H "origin/${PLATFORM_BRANCH}..upstream/${UPSTREAM_BRANCH}" | grep -q .; then
            echo 'changes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changes=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare a merge candidate
        if: steps.upstream.outputs.changes == 'true'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="sync/upstream-${GITHUB_RUN_ID}"
          git checkout -B "$branch" "origin/${PLATFORM_BRANCH}"
          if ! git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}"; then
            git merge --abort || true
            if [ "$(gh issue list --state open --search 'Upstream sync conflict in:title' --json number --jq 'length')" = '0' ]; then
              gh issue create --title 'Upstream sync conflict' --body "The scheduled upstream sync could not merge ${UPSTREAM_REPOSITORY}@${UPSTREAM_BRANCH} into ${PLATFORM_BRANCH}. No platform branch was changed. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            fi
            exit 1
          fi
          git commit -m "chore(sync): merge upstream ${UPSTREAM_BRANCH}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        if: steps.upstream.outputs.changes == 'true'
        with:
          python-version: '3.12'

      - name: Install locked test dependencies
        if: steps.upstream.outputs.changes == 'true'
        run: uv sync --locked

      - name: Restore test data access
        if: steps.upstream.outputs.changes == 'true'
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          test -n "$GDRIVE_CREDENTIALS_DATA"
          printf '%s' "$GDRIVE_CREDENTIALS_DATA" > credentials.json
          uv run dvc remote modify --local myremote credentialpath credentials.json
          uv run dvc pull -v

      - name: Validate merge candidate
        if: steps.upstream.outputs.changes == 'true'
        run: |
          uv run python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml -m 'not fails_gha'
          uv run mypy --install-types --non-interactive --config-file pyproject.toml soccerdata tests
        env:
          SOCCERDATA_DIR: tests/appdata

      - name: Publish the tested synchronization
        if: steps.upstream.outputs.changes == 'true'
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${PLATFORM_BRANCH}"
